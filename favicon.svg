<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0f172a"/>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Code brackets -->
  <!-- Left bracket -->
  <path d="M 50 60 L 45 60 L 45 140 L 50 140" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Right bracket -->
  <path d="M 150 60 L 155 60 L 155 140 L 150 140" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Central icon: Lightbulb with question mark -->
  <!-- Lightbulb body -->
  <circle cx="100" cy="85" r="20" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Lightbulb base -->
  <rect x="92" y="105" width="16" height="10" rx="2" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Question mark inside lightbulb -->
  <text x="100" y="95" font-size="28" font-weight="bold" fill="#1e293b" text-anchor="middle" font-family="Arial, sans-serif">?</text>
  
  <!-- Shine effect on lightbulb -->
  <circle cx="92" cy="78" r="6" fill="#fff" opacity="0.6"/>
  
  <!-- Light rays -->
  <line x1="100" y1="50" x2="100" y2="35" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="65" x2="146" y2="54" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="65" x2="54" y2="54" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small accent dots -->
  <circle cx="30" cy="30" r="2.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="170" cy="170" r="2.5" fill="#06b6d4" opacity="0.6"/>
</svg>
